<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список дел</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <a href="index.html" class="logo-btn" aria-label="Главная">
          <span>Г</span>
        </a>
        <nav class="sidebar-nav">
          <a href="todo.html" class="nav-btn active" data-tooltip="Список дел">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </a>
          <a href="goals.html" class="nav-btn" data-tooltip="Трекер целей">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="7"></circle>
              <polyline
                points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"
              ></polyline>
            </svg>
          </a>
          <a
            href="habits.html"
            class="nav-btn"
            data-tooltip="Конструктор привычек"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </a>
          <a href="mood.html" class="nav-btn" data-tooltip="Трекер настроения">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </a>
          <a
            href="reports.html"
            class="nav-btn"
            data-tooltip="Отчёты и аналитика"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="page">
          <div class="page-header">
            <div>
              <h1>Список дел</h1>
              <p>Организуйте свои задачи и установите напоминания</p>
            </div>
            <button class="btn-primary" id="add-todo-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Добавить
            </button>
          </div>

          <!-- Форма добавления задачи -->
          <div class="form-container" id="todo-form">
            <h3>Новая задача</h3>
            <div class="form-group">
              <input
                type="text"
                id="todo-title"
                placeholder="Название задачи"
              />
              <textarea
                id="todo-description"
                placeholder="Описание (необязательно)"
                rows="3"
              ></textarea>
              <div class="form-row">
                <div class="form-field">
                  <label>Срок выполнения</label>
                  <input type="date" id="todo-date" />
                </div>
                <div class="form-field">
                  <label>Напоминание</label>
                  <input type="time" id="todo-time" />
                </div>
              </div>
              <div class="form-actions">
                <button class="btn-primary" id="save-todo">
                  Добавить задачу
                </button>
                <button class="btn-outline" id="cancel-todo">Отмена</button>
              </div>
            </div>
          </div>

          <!-- Список задач -->
          <div class="tasks-container" id="tasks-list">
            <!-- Задачи будут добавляться динамически -->
          </div>
        </div>
      </main>
    </div>
    <!-- Модальное окно редактирования задачи -->
    <div class="modal" id="edit-todo-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Редактировать задачу</h3>
          <button class="close-btn" onclick="closeEditModal()">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-todo-id" />
          <div class="form-group">
            <input
              type="text"
              id="edit-todo-title"
              placeholder="Название задачи"
            />
            <textarea
              id="edit-todo-description"
              placeholder="Описание (необязательно)"
              rows="3"
            ></textarea>
            <div class="form-row">
              <div class="form-field">
                <label>Срок выполнения</label>
                <input type="date" id="edit-todo-date" />
              </div>
              <div class="form-field">
                <label>Напоминание</label>
                <input type="time" id="edit-todo-time" />
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-primary" onclick="saveEditedTodo()">
                Сохранить изменения
              </button>
              <button class="btn-outline" onclick="closeEditModal()">
                Отмена
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/todo.js"></script>
  </body>
</html>
