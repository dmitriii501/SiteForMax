<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конструктор привычек</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <a href="index.html" class="logo-btn" aria-label="Главная">
          <span>Г</span>
        </a>
        <nav class="sidebar-nav">
          <a href="todo.html" class="nav-btn" data-tooltip="Список дел">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </a>
          <a href="goals.html" class="nav-btn" data-tooltip="Трекер целей">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="7"></circle>
              <polyline
                points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"
              ></polyline>
            </svg>
          </a>
          <a
            href="habits.html"
            class="nav-btn active"
            data-tooltip="Конструктор привычек"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </a>
          <a href="mood.html" class="nav-btn" data-tooltip="Трекер настроения">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </a>
          <a
            href="reports.html"
            class="nav-btn"
            data-tooltip="Отчёты и аналитика"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="page">
          <div class="page-header">
            <div>
              <h1>Трекер привычек</h1>
              <p>
                Выработайте постоянство с помощью ежедневного отслеживания
                привычек
              </p>
            </div>
            <button class="btn-primary" id="add-habit-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Добавить привычку
            </button>
          </div>

          <!-- Форма добавления привычки -->
          <div class="modal" id="habit-modal">
            <div class="modal-content">
              <div class="modal-header">
                <h3>Создать новую привычку</h3>
                <button class="close-btn" id="close-habit-modal">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
              <div class="modal-body">
                <input
                  type="text"
                  id="habit-name"
                  placeholder="Название привычки (например, Медитация 10 мин)"
                />
                <button class="btn-primary" id="save-habit">
                  Создать привычку
                </button>
              </div>
            </div>
          </div>

          <!-- Шаблон потребления воды -->
          <div class="water-tracker">
            <div class="water-header">
              <div class="water-icon">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="m12 2.69 5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
              </div>
              <div class="water-info">
                <div class="water-title-section">
                  <h3>Потребление воды</h3>
                  <button class="calendar-btn" id="water-calendar-btn">
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2"
                        ry="2"
                      ></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                  </button>
                </div>
                <p id="water-progress">1200мл / 2000мл</p>
                <div class="water-date" id="water-current-date">Сегодня</div>
              </div>
            </div>

            <!-- Мини-календарь -->
            <div
              class="water-calendar"
              id="water-calendar"
              style="display: none"
            >
              <!-- Календарь будет рендериться динамически -->
            </div>

            <div class="water-circles" id="water-circles">
              <!-- Круги воды будут добавляться динамически -->
            </div>
            <div class="water-controls">
              <button class="btn-primary" id="add-water">Добавить 100мл</button>
              <button class="btn-outline" id="clear-water">Очистить</button>
              <input
                type="number"
                id="water-goal"
                value="2000"
                min="100"
                step="100"
              />
              <button class="btn-outline" id="update-water-goal">
                Обновить цель
              </button>
            </div>
          </div>

          <!-- Список привычек -->
          <div class="habits-container" id="habits-list">
            <!-- Привычки будут добавляться динамически -->
          </div>
        </div>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/habits.js"></script>
  </body>
</html>
