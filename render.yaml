services:
  # Backend API (FastAPI)
  - type: web
    name: maxpersonal-effect-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: maxpersonal-effect-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: false
    healthCheckPath: /health

  # Frontend (Static Site)
  - type: web
    name: maxpersonal-effect-frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # PostgreSQL Database
  - type: pg
    name: maxpersonal-effect-db
    plan: free
    databaseName: maxpersonal_effect
    user: maxpersonal_user

